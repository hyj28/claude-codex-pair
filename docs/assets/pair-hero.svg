<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">claude-codex-pair — two agents, one disciplined workflow</title>
  <desc id="desc">A split violet and cyan technical banner showing Claude planning and reviewing, Codex implementing, and deterministic gates between them.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="20" x2="1163" y2="429" gradientUnits="userSpaceOnUse">
      <stop stop-color="#150E25"/>
      <stop offset="0.49" stop-color="#10182A"/>
      <stop offset="1" stop-color="#071C20"/>
    </linearGradient>
    <linearGradient id="bridge" x1="388" y1="0" x2="812" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="0.5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="word" x1="165" y1="98" x2="1036" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E8FF"/>
      <stop offset="0.48" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(246 184) rotate(90) scale(240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(962 207) rotate(90) scale(230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#CBD5E1" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="246" cy="184" r="240" fill="url(#violetGlow)"/>
    <circle cx="962" cy="207" r="230" fill="url(#cyanGlow)"/>
    <path d="M600 0V440" stroke="#E2E8F0" stroke-opacity="0.055"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">
      <text x="79" y="72" fill="#D8B4FE">PLANNER · REVIEWER</text>
      <text x="907" y="72" fill="#67E8F9">IMPLEMENTER</text>
    </g>

    <text x="75" y="195" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="79" font-weight="800" letter-spacing="-4">claude</text>
    <text x="473" y="195" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="57" font-weight="300">×</text>
    <text x="548" y="195" fill="url(#word)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="79" font-weight="800" letter-spacing="-4">codex</text>
    <text x="80" y="241" fill="#AFC0D8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">Two agents. Separate contexts. Deterministic gates. You decide what merges.</text>

    <g transform="translate(79 292)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">
      <g>
        <rect width="122" height="42" rx="10" fill="#A855F7" fill-opacity="0.12" stroke="#C084FC" stroke-opacity="0.38"/>
        <circle cx="20" cy="21" r="4" fill="#C084FC"/><text x="34" y="26" fill="#F3E8FF">PLAN</text>
      </g>
      <path d="M132 21H165" stroke="url(#bridge)" stroke-width="2"/><path d="M158 16L165 21L158 26" stroke="#D8B4FE" stroke-width="2" fill="none"/>
      <g transform="translate(175)">
        <rect width="156" height="42" rx="10" fill="#8B5CF6" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.32"/>
        <circle cx="20" cy="21" r="4" fill="#A78BFA"/><text x="34" y="26" fill="#EDE9FE">HANDOFF</text>
      </g>
      <path d="M341 21H374" stroke="url(#bridge)" stroke-width="2"/><path d="M367 16L374 21L367 26" stroke="#C4B5FD" stroke-width="2" fill="none"/>
      <g transform="translate(384)">
        <rect width="156" height="42" rx="10" fill="#22D3EE" fill-opacity="0.09" stroke="#67E8F9" stroke-opacity="0.32"/>
        <circle cx="20" cy="21" r="4" fill="#67E8F9"/><text x="34" y="26" fill="#CFFAFE">IMPLEMENT</text>
      </g>
      <path d="M550 21H583" stroke="url(#bridge)" stroke-width="2"/><path d="M576 16L583 21L576 26" stroke="#67E8F9" stroke-width="2" fill="none"/>
      <g transform="translate(593)">
        <rect width="142" height="42" rx="10" fill="#10B981" fill-opacity="0.09" stroke="#6EE7B7" stroke-opacity="0.32"/>
        <circle cx="20" cy="21" r="4" fill="#6EE7B7"/><text x="34" y="26" fill="#D1FAE5">GATES</text>
      </g>
      <path d="M745 21H778" stroke="url(#bridge)" stroke-width="2"/><path d="M771 16L778 21L771 26" stroke="#94EAD7" stroke-width="2" fill="none"/>
      <g transform="translate(788)">
        <rect width="142" height="42" rx="10" fill="#A855F7" fill-opacity="0.10" stroke="#C084FC" stroke-opacity="0.34"/>
        <circle cx="20" cy="21" r="4" fill="#C084FC"/><text x="34" y="26" fill="#F3E8FF">REVIEW</text>
      </g>
    </g>

    <g transform="translate(79 381)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <circle cx="4" cy="-4" r="4" fill="#34D399" filter="url(#glow)"/>
      <text x="17" fill="#94A3B8">OPT-IN BY DESIGN</text>
      <circle cx="180" cy="-4" r="4" fill="#34D399"/>
      <text x="193" fill="#94A3B8">BOUNDED LOOPS</text>
      <circle cx="352" cy="-4" r="4" fill="#34D399"/>
      <text x="365" fill="#94A3B8">HUMAN MERGE</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="27.25" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
